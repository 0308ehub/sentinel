# Runs Kismet's loop every hour. Vercel Hobby only allows a daily cron (vercel.json keeps that one as a
# fallback), so GitHub's scheduler calls the same endpoint with the same CRON_SECRET bearer.
# Needs the repository secret CRON_SECRET (Settings → Secrets and variables → Actions), equal to Vercel's.
name: Kismet loop

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: kismet-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run the loop
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the CRON_SECRET repository secret to the value in Vercel."
            exit 1
          fi
          status=$(curl -sS -o body.json -w '%{http_code}' --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://app.sentinelai.one/api/autopilot/tick)
          head -c 2000 body.json; echo
          [ "$status" = "200" ] || { echo "::error::Tick returned $status"; exit 1; }
